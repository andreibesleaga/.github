name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.2.0 or the commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. OS, runtime and version (Node 22, Python 3.12, PHP 8.4), Docker or not
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove secrets, API keys and personal data before pasting.
      render: text
